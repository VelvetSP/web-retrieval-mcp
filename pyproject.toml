[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "web-retrieval-mcp"
version = "0.2.0"
description = "Reliable MCP web search and web fetch for AI agents with Exa, Tavily, Camoufox, Firecrawl, provenance, caching, and SSRF guards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VelvetSP" }]
keywords = [
  "mcp", "mcp-server", "model-context-protocol", "ai-agents", "llm-tools",
  "web-search", "web-fetch", "web-scraping", "web-retrieval", "retrieval",
  "rag", "research-papers", "developer-search", "claude-code", "cursor",
  "exa", "tavily", "firecrawl", "camoufox", "ssrf",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "mcp==2.1.1",
  "anyio==4.14.2",
]

[project.optional-dependencies]
render = [
  "camoufox[geoip]==0.5.5",
  "playwright>=1.60,<1.61",
]
cache = ["valkey==6.1.1"]
tavily = ["tavily-python==0.8.0"]
keyring = ["keyring>=24,<27"]
all = [
  "camoufox[geoip]==0.5.5",
  "playwright>=1.60,<1.61",
  "valkey==6.1.1",
  "tavily-python==0.8.0",
  "keyring>=24,<27",
]
dev = [
  "build>=1.2,<2",
  "hatchling==1.31.0",
  "readme-renderer[md]>=46,<47",
  "twine>=5,<7",
]

[project.scripts]
web-retrieval-mcp = "web_retrieval_mcp.server:main"
web-retrieval-mcp-install = "web_retrieval_mcp.install:main"

[project.urls]
Homepage = "https://github.com/VelvetSP/web-retrieval-mcp"
Documentation = "https://github.com/VelvetSP/web-retrieval-mcp#readme"
Source = "https://github.com/VelvetSP/web-retrieval-mcp"
Issues = "https://github.com/VelvetSP/web-retrieval-mcp/issues"
"Release Notes" = "https://github.com/VelvetSP/web-retrieval-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/web_retrieval_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/web_retrieval_mcp/hooks/deny-web-builtins.sh" = "web_retrieval_mcp/hooks/deny-web-builtins.sh"

[tool.hatch.build.targets.sdist]
include = [
  "src/", "tests/", "docs/", ".github/", "README.md", "LICENSE",
  "AGENTS.md", "PUBLISHING.md", "SECURITY.md", "server.json", "pyproject.toml",
  "llms.txt", "run-tests.sh", "test_*.py", "valkey_test_support.py",
]
