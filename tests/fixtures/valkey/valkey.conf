# Disposable completed-result cache used only by isolated integration tests.
daemonize no
supervised systemd
port 0
protected-mode yes
unixsocketperm 600

# No persistence: every test starts with a disposable cache.
save ""
appendonly no
dbfilename web-retrieval-cache.rdb

# Tests override this value when exercising capacity-specific behavior.
maxmemory 32mb
maxmemory-policy allkeys-lfu
maxmemory-samples 10

databases 1
logfile ""
loglevel notice
